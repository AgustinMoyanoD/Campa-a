# ============================================================
# assets/glossary.cfg - Glosario de terminos y conceptos
# ============================================================

[TIRADA]
Title=Tirada
Text=Resultado de los dados 2d6 mas modificadores aplicables por atributos o cartas.

[PUNTAJE]
Title=Puntaje de Fuerza
Text=Puntaje total de combate de un bando, combinando tropas activas, planes y cartas.

[CHOQUE]
Title=Choque
Text=El intercambio de dano de la ronda. Un multiplicador mayor aumenta el dano recibido y el infligido.

[MARGEN]
Title=Margen
Text=Diferencia neta entre el puntaje de ambos bandos. Determina que bando sufre bajas.

[INTENCION]
Title=Intencion Enemiga
Text=Postura tactica enemiga para la ronda (Carga, Asedio o Repliegue). Revelada con buena evaluacion.

[FATIGADO]
Title=Plan Cansado
Text=Repetir el mismo plan dos rondas seguidas reduce a la mitad sus bonos y penalizaciones.

[EXPUESTO]
Title=Flanco Expuesto
Text=El enemigo descuido sus flancos. Permite ejecutar el plan de Flanqueo con bonificaciones masivas.

[FORTIFICADO]
Title=Fortificado
Text=Unidad apostada tras murallas o parapetos. Gran resistencia al choque directo y reduccion de bajas.

[DESORGANIZADOS]
Title=Desorganizados
Text=El escuadron perdio su cohesion militar, sufriendo penalizaciones severas a la tirada.

[CABALLERIA]
Title=Caballeria
Text=Tropas montadas veloces y letales al cargar, pero vulnerables ante formaciones de picas.

[MANDO]
Title=Fichas de Mando
Text=Puntos de liderazgo que permiten alterar la planificacion: sumar +2 a la tirada o repetir dados.

[FUERA_DE_COMBATE]
Title=Fuera de Combate
Text=Tropas caidas durante el choque. Al terminar la batalla, el recuento define cuantas murieron y cuantas sobreviven.

[VENTAJA]
Title=Ventaja Tactica
Text=Tu plan contrarresta directamente la intencion enemiga, otorgando bonos superiores de combate.

[DESVENTAJA]
Title=Desventaja Tactica
Text=Tu plan es vulnerable ante la maniobra enemiga, aumentando el riesgo de sufrir bajas.

[MORAL]
Title=Moral del Ejercito
Text=Espiritu combativo de las tropas. Si cae a 0, las tropas desertan masivamente y arriesgan un motin.

[SALUD]
Title=Salud del Ejercito
Text=Estado fisico y resistencia de los soldados. Si cae a 0 por inanicion o heridas, el ejercito perece.

[RACIONES]
Title=Raciones de Suministro
Text=Dias proyectados de comida y agua restantes antes de que comience la inanicion o deshidratacion.

[INFAMIA]
Title=Infamia
Text=Notoriedad moral del ejercito. Facciones honorables te cerraran el paso; bandas despiadadas te respetaran.

[LEALTAD]
Title=Lealtad
Text=Fidelidad de los oficiales y tropas hacia el general en jefe. Una lealtad critica desata el motin.

[EMBOSCADA]
Title=Emboscada
Text=Ataque por sorpresa desde terreno con cobertura. Quien embosca anula la evaluacion rival e inicia con ventaja.

[ACAMPAR]
Title=Acampar
Text=Montar campamento al atardecer para recuperar salud y moral. El riesgo de emboscada depende de la cobertura.

[FORRAJEAR]
Title=Forrajear
Text=Recolectar provisiones silvestres segun el bioma transitado. Consume tiempo hasta la tarde.

[MARCHA_NOCTURNA]
Title=Marcha Nocturna
Text=Continuar el avance durante la noche (+50% coste de PA). Marchar sin descansar desgasta salud y moral.

[ZOC]
Title=Zona de Control
Text=Area inmediata que rodea a un enemigo. Salir de una casilla adyacente cuesta 1 PA adicional.

[ALERTA]
Title=Nivel de Alerta
Text=Vigilancia militar de una faccion. A mayor alerta, mas patrullas hostiles y precios mas elevados.

[COMIDA]
Title=Comida
Text=Viveres consumidos diariamente por soldados y bestias. La escasez prolongada causa hambre y desercion.

[AGUA]
Title=Agua
Text=Recurso vital indispensable. Su falta provoca sed y debilidad fisica mucho mas rapido que el hambre.

[ORO]
Title=Oro
Text=Moneda para comerciar en mercados, ascender reclutas en la armeria o pagar sanadores y posadas.

[GANADO]
Title=Ganado
Text=Animales de carga y sustento. Pueden sacrificarse en caso de emergencia alimentaria extrema.

[PA]
Title=Puntos de Accion
Text=Puntos obtenidos mediante tiradas de dados 2d6 para moverte y realizar acciones cada turno.

[INICIADOS]
Title=Iniciados
Text=Reclutas inexpertos de vanguardia. Absorben las primeras bajas en el combate antes de los soldados veteranos.

[SOLDADOS]
Title=Soldados
Text=Tropas regulares experimentadas. Forman la columna vertebral del batallon.

[SARGENTOS]
Title=Sargentos
Text=Suboficiales de elite y veteranos respetados. Mantienen la disciplina y el liderazgo en filas.

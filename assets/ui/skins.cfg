; assets/ui/skins.cfg
; Propuesta de formato (INI del proyecto) para el modulo ui_skin.c. Se puede adaptar.
; Rutas relativas a assets/.
; Slice = izquierda arriba derecha abajo, en pixeles del arte ORIGINAL (a 1x).
; Todo el arte estructural esta en tonos neutros: el color final sale de Tint (multiplicacion).
; Los destinos se redondean a enteros y la UI se escala con un factor ENTERO (filtro en punto).

[SKIN_BUTTON]
Texture=ui/ui_button.png
Cells=idle hover pressed disabled     ; 4 celdas horizontales
CellSize=32 32
Slice=4 4 4 4

[SKIN_PANEL_DARK]
Texture=ui/ui_panel_dark.png
Slice=8 8 8 8

[SKIN_PANEL_PARCHMENT]
Texture=ui/ui_panel_parchment.png
Slice=8 8 8 8

[SKIN_SLOT]
Texture=ui/ui_slot_inset.png
Slice=3 3 3 3

[SKIN_BAR_FRAME]
Texture=ui/ui_bar_frame.png
Slice=3 3 3 3
Fill=ui/ui_bar_fill.png               ; se estira en horizontal segun el porcentaje

[SKIN_TOOLTIP]
Texture=ui/ui_tooltip.png
Slice=4 4 4 4

[SKIN_CHIP]
Texture=ui/ui_chip.png
Slice=3 3 3 3

[OVERLAY_HIGHLIGHT]
Texture=ui/ui_highlight.png
Slice=4 4 4 4
Blend=additive                        ; intensidad = alpha 0..1 (hover, seleccionado)

[OVERLAY_GLOW]
Texture=ui/ui_glow.png
Slice=8 8 8 8
Blend=additive
Outset=8                              ; se dibuja expandido 8 px (x escala) alrededor del elemento

[DECAL_CRACK]
Stages=ui/ui_crack_1.png ui/ui_crack_2.png ui/ui_crack_3.png   ; 32x32, se pegan en una esquina
Blend=alpha

[ICONS]
Dir=ui/icons
Size=16 16
; icon_agua, icon_vino, icon_comida, icon_carne, icon_salud, icon_moral,
; icon_satisfaccion, icon_ganado, icon_aviso, icon_ok, icon_peligro

; ------------------------------------------------------------------
; Estilos de ejemplo. Tint y Text van por estado: idle | hover | pressed | disabled
; Reemplazar los colores por los de ui_theme.h (rol semantico, no decorativo).
; ------------------------------------------------------------------
[STYLE_BUTTON_DEFAULT]
Skin=SKIN_BUTTON
Frame=true
Tint=225 190 120 | 245 215 150 | 190 155 95 | 130 130 130
Text=245 235 210 | 255 248 225 | 215 205 175 | 140 140 140

[STYLE_BUTTON_PRIMARY]
Skin=SKIN_BUTTON
Frame=true
Tint=120 205 140 | 150 225 165 | 95 165 112 | 120 130 122
Text=240 250 240 | 255 255 255 | 215 230 215 | 140 140 140

[STYLE_BUTTON_DANGER]
Skin=SKIN_BUTTON
Frame=true
Tint=225 105 95 | 245 135 120 | 180 80 72 | 130 120 120
Text=250 235 230 | 255 245 240 | 225 205 200 | 140 140 140

[STYLE_BUTTON_CURSE]
Skin=SKIN_BUTTON
Frame=true
Tint=185 115 235 | 205 140 250 | 145 90 190 | 125 120 135
Text=245 235 255 | 255 245 255 | 220 205 235 | 140 140 150

[STYLE_BUTTON_FLAT]
Skin=SKIN_BUTTON
Frame=false                           ; sin marco: solo texto (listas densas, menos ruido)
Text=225 215 185 | 255 235 150 | 190 180 150 | 120 120 120

[STYLE_PANEL_DEFAULT]
Skin=SKIN_PANEL_DARK
Tint=215 185 130

[STYLE_PANEL_PARCHMENT]
Skin=SKIN_PANEL_PARCHMENT
Tint=255 236 206

[STYLE_TOOLTIP_DEFAULT]
Skin=SKIN_TOOLTIP
Tint=230 195 120

[STYLE_CHIP_OK]
Skin=SKIN_CHIP
Tint=110 200 120

[STYLE_CHIP_WARN]
Skin=SKIN_CHIP
Tint=230 180 70

[STYLE_CHIP_BAD]
Skin=SKIN_CHIP
Tint=220 85 80

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campfire - Editor de Eventos V3</title>
    <style>
        :root { --bg: #1e1e1e; --surface: #2d2d2d; --primary: #d4af37; --text: #e0e0e0; --border: #444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        h1 { margin: 0; color: var(--primary); }
        button { background-color: var(--primary); color: #000; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { filter: brightness(1.1); }
        .main-container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .sidebar { width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { padding: 8px; margin-bottom: 5px; background: #3a3a3a; border-radius: 4px; cursor: pointer; border-left: 3px solid transparent; }
        .list-item:hover { background: #4a4a4a; }
        .list-item.selected { border-left-color: var(--primary); background: #444; }
        .editor { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, textarea, select { width: 100%; padding: 8px; background: #111; color: white; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        .options-container { border: 1px solid var(--border); padding: 10px; border-radius: 4px; margin-bottom: 10px; background: #222; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .hidden { display: none !important; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .tab { padding: 8px 15px; cursor: pointer; color: #888; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; background: #111; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .checkbox-group label { display: flex; align-items: center; font-weight: normal; margin: 0; color: white; gap: 5px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: auto; margin: 0; }
        .effect-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .effect-row select, .effect-row input { flex: 1; margin: 0; }
        .effect-row button { background: #aa3333; color: white; padding: 8px 12px; }
    </style>
</head>
<body>

<header>
    <h1>Campfire - Editor de Eventos V3</h1>
    <div>
        <button id="btn-load">📂 Abrir Carpeta assets/</button>
        <button id="btn-save" class="hidden">💾 Guardar Cambios</button>
    </div>
</header>

<div class="main-container hidden" id="workspace">
    <div class="sidebar">
        <div class="tabs">
            <div class="tab active" id="tab-events">Eventos (.evt)</div>
            <div class="tab" id="tab-results">Resultados (.res)</div>
        </div>
        <div class="sidebar-header">
            <button id="btn-new">➕ Nuevo</button>
        </div>
        <div class="list-container" id="file-list"></div>
    </div>

    <div class="editor" id="editor-area">
        <div id="welcome-msg" style="text-align: center; color: #888; margin-top: 20%;">
            Selecciona un archivo o crea uno nuevo.
        </div>
        
        <!-- EDITOR RESULTADOS -->
        <div id="form-result" class="hidden">
            <h2 style="margin-top:0">Editar Resultado</h2>
            <div class="form-group"><label>ID del Resultado</label><input type="text" id="res-id"></div>
            <div class="form-group"><label>Nombre (Título)</label><input type="text" id="res-name"></div>
            <div class="form-group"><label>Descripción</label><textarea id="res-desc" placeholder="Usa \n para saltos de línea"></textarea></div>
            
            <h3 style="border-bottom: 1px solid #444; padding-bottom:5px; margin-top: 20px;">Efectos</h3>
            <div id="effects-list"></div>
            <button id="btn-add-effect" style="background: #444; color: white; margin-bottom:20px;">+ Agregar Efecto</button>
            
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="res-battle" style="width:auto;"> Inicia Batalla
                </label>
            </div>
            <div class="form-group" id="res-battle-opts" class="hidden">
                <label>Enemigo (ID)</label>
                <input type="text" id="res-battle-enemy">
            </div>
        </div>

        <!-- EDITOR EVENTOS -->
        <div id="form-event" class="hidden">
            <h2 style="margin-top:0">Editar Evento</h2>
            <div class="grid-2">
                <div class="form-group"><label>ID</label><input type="text" id="ev-id"></div>
                <div class="form-group"><label>Nombre</label><input type="text" id="ev-name"></div>
            </div>
            <div class="form-group"><label>Descripción</label><textarea id="ev-desc"></textarea></div>
            
            <div class="grid-3">
                <div class="form-group"><label>Probabilidad (1-100)</label><input type="number" id="ev-prob" value="50"></div>
            </div>
            
            <div class="form-group">
                <label>Triggers</label>
                <div class="checkbox-group" id="ev-triggers">
                    <label><input type="checkbox" value="RANDOM"> RANDOM</label>
                    <label><input type="checkbox" value="ROAD"> ROAD</label>
                    <label><input type="checkbox" value="BATTLE_START"> BATTLE_START</label>
                    <label><input type="checkbox" value="BATTLE_END"> BATTLE_END</label>
                    <label><input type="checkbox" value="CITY"> CITY</label>
                    <label><input type="checkbox" value="MARKET"> MARKET</label>
                    <label><input type="checkbox" value="HOUSE"> HOUSE</label>
                    <label><input type="checkbox" value="CASTLE"> CASTLE</label>
                    <label><input type="checkbox" value="ARMORY"> ARMORY</label>
                    <label><input type="checkbox" value="NIGHT"> NIGHT (legacy)</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Time (Hora)</label>
                <div class="checkbox-group" id="ev-times">
                    <label><input type="checkbox" value="MORNING"> MORNING</label>
                    <label><input type="checkbox" value="MIDDAY"> MIDDAY</label>
                    <label><input type="checkbox" value="AFTERNOON"> AFTERNOON</label>
                    <label><input type="checkbox" value="NIGHT"> NIGHT</label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Biome (Bioma)</label>
                <div class="checkbox-group" id="ev-biomes">
                    <label><input type="checkbox" value="PLAINS"> PLAINS</label>
                    <label><input type="checkbox" value="FOREST"> FOREST</label>
                    <label><input type="checkbox" value="DESERT"> DESERT</label>
                    <label><input type="checkbox" value="JUNGLE"> JUNGLE</label>
                    <label><input type="checkbox" value="MOUNTAIN"> MOUNTAIN</label>
                    <label><input type="checkbox" value="WATER"> WATER</label>
                </div>
            </div>
            
            <h3 style="border-bottom: 1px solid #444; padding-bottom:5px;">Condiciones Mínimas</h3>
            <div class="grid-3">
                <div class="form-group"><label>Min Infamia</label><input type="number" step="0.1" id="ev-mininf" value="0"></div>
                <div class="form-group"><label>Max Infamia</label><input type="number" step="0.1" id="ev-maxinf" value="100"></div>
                <div class="form-group"><label>Min Oro</label><input type="number" id="ev-mingold" value="0"></div>
                <div class="form-group"><label>Min Comida</label><input type="number" step="0.1" id="ev-minfood" value="0"></div>
                <div class="form-group"><label>Min Agua</label><input type="number" step="0.1" id="ev-minwater" value="0"></div>
                <div class="form-group"><label>Tamaño Ejército</label><input type="number" id="ev-minarmy" value="0"></div>
            </div>

            <h3 style="border-bottom: 1px solid #444; padding-bottom:5px;">Opciones (<span id="opt-count">0</span>/5)</h3>
            <div id="options-list"></div>
            <button id="btn-add-opt" style="background: #444; color: white;">+ Agregar Opción</button>
        </div>
    </div>
</div>

<script>
let dirHandle = null;
let mode = 'events'; 
let items = { events: [], results: [] };
let selectedItem = null;

const parseIni = (text) => {
    const lines = text.split('\n');
    let obj = { effects: [], options: [], triggers: [], times: [], biomes: [] };
    let currentOpt = -1;
    
    for (let line of lines) {
        line = line.trim();
        if (line.charCodeAt(0) === 0xFEFF) line = line.substring(1);
        if (!line || line.startsWith('#')) continue;
        
        if (line.startsWith('[EVENT]') || line.startsWith('[RESULT]')) continue;
        if (line.startsWith('[OPTION_')) {
            currentOpt = parseInt(line.replace('[OPTION_', '').replace(']', '')) - 1;
            if (!obj.options[currentOpt]) obj.options[currentOpt] = {};
            continue;
        }
        
        let idx = line.indexOf('=');
        if (idx > -1) {
            let key = line.substring(0, idx).trim();
            let val = line.substring(idx + 1).trim();
            if (currentOpt === -1) {
                if (key === 'Effect') {
                    const [stat, delta] = val.split(':').map(s=>s.trim());
                    obj.effects.push({stat, delta});
                }
                else if (key === 'Trigger') obj.triggers = val.split(',').map(s=>s.trim());
                else if (key === 'Time') obj.times = val.split(',').map(s=>s.trim());
                else if (key === 'Biome') obj.biomes = val.split(',').map(s=>s.trim());
                else obj[key] = val;
            } else {
                obj.options[currentOpt][key] = val;
            }
        }
    }
    // Backward compatibility conversions internally just to show
    const legacyMap = {
        'Result_Gold': 'gold', 'Result_Infamy': 'infamy', 'Result_Moral': 'moral',
        'Result_Food': 'food', 'Result_Water': 'water'
    };
    for (let [k, v] of Object.entries(legacyMap)) {
        if (obj[k]) { obj.effects.push({stat: v, delta: '+'+obj[k].replace('+','')}); delete obj[k]; }
    }
    const legacyLoss = { 'Loss_Initiates':'initiates', 'Loss_Soldiers':'soldiers', 'Loss_Sergeants':'sergeants' };
    for (let [k, v] of Object.entries(legacyLoss)) {
        if (obj[k]) { obj.effects.push({stat: v, delta: '-'+obj[k].replace('-','')}); delete obj[k]; }
    }
    
    return obj;
};

const stringifyIni = (type, obj) => {
    let out = type === 'events' ? '[EVENT]\n' : '[RESULT]\n';
    out += `Id=${obj.Id}\n`;
    out += `Name=${obj.Name}\n`;
    if (obj.Description) out += `Description=${obj.Description}\n`;
    
    if (type === 'events') {
        if (obj.triggers && obj.triggers.length) out += `Trigger=${obj.triggers.join(', ')}\n`;
        if (obj.times && obj.times.length) out += `Time=${obj.times.join(', ')}\n`;
        if (obj.biomes && obj.biomes.length) out += `Biome=${obj.biomes.join(', ')}\n`;
        
        const fields = ['Probability','MinInfamy','MaxInfamy','MinGold','MinFood','MinWater','MinArmySize'];
        for (let f of fields) { if (obj[f] !== undefined && obj[f] !== '') out += `${f}=${obj[f]}\n`; }
        
        out += '\n';
        for (let i=0; i<obj.options.length; i++) {
            let opt = obj.options[i];
            out += `[OPTION_${i+1}]\n`;
            if (opt.Text) out += `Text=${opt.Text}\n`;
            out += `Result_pool=${opt.Result_pool || 'NONE'}\n\n`;
        }
    } else {
        if (obj.effects) {
            for (let e of obj.effects) {
                out += `Effect=${e.stat}:${e.delta}\n`;
            }
        }
        if (obj.Result_Battle) {
            out += `Result_Battle=1\n`;
            out += `Enemy=${obj.Enemy||''}\n`;
        }
    }
    return out.trim() + '\n';
};

document.getElementById('btn-load').addEventListener('click', async () => {
    try {
        dirHandle = await window.showDirectoryPicker();
        await loadFiles();
        document.getElementById('btn-save').classList.remove('hidden');
        document.getElementById('workspace').classList.remove('hidden');
    } catch (e) {
        console.error(e);
        alert('Error abriendo carpeta o cancelado.');
    }
});

let eventsDirHandle = null;
let resultsDirHandle = null;

async function loadFiles() {
    items = { events: [], results: [] };
    
    try { eventsDirHandle = await dirHandle.getDirectoryHandle('events', { create: false }); } catch(e) { eventsDirHandle = dirHandle; }
    try { resultsDirHandle = await dirHandle.getDirectoryHandle('results', { create: false }); } catch(e) { resultsDirHandle = dirHandle; }
    
    // Leer eventos
    for await (const entry of eventsDirHandle.values()) {
        if (entry.kind === 'file' && entry.name.endsWith('.evt')) {
            const file = await entry.getFile();
            items.events.push({ handle: entry, parentHandle: eventsDirHandle, data: parseIni(await file.text()), isNew: false, filename: entry.name });
        }
    }
    
    // Leer resultados
    for await (const entry of resultsDirHandle.values()) {
        if (entry.kind === 'file' && (entry.name.endsWith('.res') || entry.name.endsWith('.evt'))) {
            if (entry.name.endsWith('.evt')) continue; // Solo mostrar .res
            const file = await entry.getFile();
            items.results.push({ handle: entry, parentHandle: resultsDirHandle, data: parseIni(await file.text()), isNew: false, filename: entry.name });
        }
    }
    
    // Fallback: buscar tambien en la raiz si el usuario abrio la carpeta directamente
    if (eventsDirHandle !== dirHandle) {
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file') {
                if (entry.name.endsWith('.evt')) {
                    const file = await entry.getFile();
                    items.events.push({ handle: entry, parentHandle: dirHandle, data: parseIni(await file.text()), isNew: false, filename: entry.name });
                } else if (entry.name.endsWith('.res')) {
                    const file = await entry.getFile();
                    items.results.push({ handle: entry, parentHandle: dirHandle, data: parseIni(await file.text()), isNew: false, filename: entry.name });
                }
            }
        }
    }
    
    renderList();
}

function renderList() {
    const list = document.getElementById('file-list');
    list.innerHTML = '';
    const currentItems = items[mode];
    
    currentItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'list-item' + (selectedItem === item ? ' selected' : '');
        div.textContent = item.data.Id || item.filename;
        div.onclick = () => selectItem(item);
        list.appendChild(div);
    });
}

document.getElementById('tab-events').onclick = (e) => { mode = 'events'; updateTabs(e.target); };
document.getElementById('tab-results').onclick = (e) => { mode = 'results'; updateTabs(e.target); };

function updateTabs(target) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    target.classList.add('active');
    selectedItem = null;
    document.getElementById('form-event').classList.add('hidden');
    document.getElementById('form-result').classList.add('hidden');
    document.getElementById('welcome-msg').classList.remove('hidden');
    renderList();
}

function selectItem(item) {
    selectedItem = item;
    renderList();
    document.getElementById('welcome-msg').classList.add('hidden');
    
    if (mode === 'events') {
        document.getElementById('form-event').classList.remove('hidden');
        document.getElementById('form-result').classList.add('hidden');
        fillEventForm(item.data);
    } else {
        document.getElementById('form-result').classList.remove('hidden');
        document.getElementById('form-event').classList.add('hidden');
        fillResultForm(item.data);
    }
}

document.getElementById('btn-new').onclick = () => {
    const id = prompt("Ingresa el ID del nuevo " + (mode === 'events' ? 'Evento' : 'Resultado') + ":");
    if (!id) return;
    const newItem = {
        isNew: true,
        filename: id + (mode === 'events' ? '.evt' : '.res'),
        data: { Id: id, Name: 'Nuevo', options: [], effects: [], triggers: [], times: [], biomes: [] }
    };
    items[mode].push(newItem);
    selectItem(newItem);
};

// EFFECTS BUILDER
function renderEffects() {
    const list = document.getElementById('effects-list');
    list.innerHTML = '';
    if (!selectedItem.data.effects) selectedItem.data.effects = [];
    
    selectedItem.data.effects.forEach((eff, i) => {
        const row = document.createElement('div');
        row.className = 'effect-row';
        row.innerHTML = `
            <select class="eff-stat">
                <option value="gold" ${eff.stat==='gold'?'selected':''}>Oro</option>
                <option value="infamy" ${eff.stat==='infamy'?'selected':''}>Infamia</option>
                <option value="moral" ${eff.stat==='moral'?'selected':''}>Moral</option>
                <option value="food" ${eff.stat==='food'?'selected':''}>Comida</option>
                <option value="water" ${eff.stat==='water'?'selected':''}>Agua</option>
                <option value="initiates" ${eff.stat==='initiates'?'selected':''}>Iniciados</option>
                <option value="soldiers" ${eff.stat==='soldiers'?'selected':''}>Soldados</option>
                <option value="sergeants" ${eff.stat==='sergeants'?'selected':''}>Sargentos</option>
            </select>
            <input type="text" class="eff-delta" value="${eff.delta}" placeholder="ej: +10, -50%, -ALL">
            <button class="eff-del">X</button>
        `;
        row.querySelector('.eff-del').onclick = () => {
            selectedItem.data.effects.splice(i, 1);
            renderEffects();
        };
        row.querySelector('.eff-stat').onchange = (e) => eff.stat = e.target.value;
        row.querySelector('.eff-delta').onchange = (e) => eff.delta = e.target.value;
        list.appendChild(row);
    });
}
document.getElementById('btn-add-effect').onclick = () => {
    selectedItem.data.effects.push({stat: 'gold', delta: '+10'});
    renderEffects();
};

function fillResultForm(data) {
    document.getElementById('res-id').value = data.Id || '';
    document.getElementById('res-name').value = data.Name || '';
    document.getElementById('res-desc').value = data.Description || '';
    document.getElementById('res-battle').checked = !!data.Result_Battle;
    document.getElementById('res-battle-enemy').value = data.Enemy || '';
    renderEffects();
}

// OPTIONS BUILDER
function renderOptions() {
    const list = document.getElementById('options-list');
    list.innerHTML = '';
    if (!selectedItem.data.options) selectedItem.data.options = [];
    document.getElementById('opt-count').textContent = selectedItem.data.options.length;
    
    selectedItem.data.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'options-container';
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <strong>Opción ${i+1}</strong>
                <button class="opt-del" style="background:#aa3333; padding:2px 8px;">X</button>
            </div>
            <div class="form-group"><label>Texto</label><input type="text" class="opt-text" value="${opt.Text||''}"></div>
            <div class="form-group">
                <label>Result pool (IDs separados por coma) o NONE</label>
                <input type="text" class="opt-pool" value="${opt.Result_pool||'NONE'}">
            </div>
        `;
        div.querySelector('.opt-del').onclick = () => { selectedItem.data.options.splice(i, 1); renderOptions(); };
        div.querySelector('.opt-text').onchange = (e) => opt.Text = e.target.value;
        div.querySelector('.opt-pool').onchange = (e) => opt.Result_pool = e.target.value || 'NONE';
        list.appendChild(div);
    });
    document.getElementById('btn-add-opt').style.display = selectedItem.data.options.length >= 5 ? 'none' : 'block';
}

document.getElementById('btn-add-opt').onclick = () => {
    selectedItem.data.options.push({ Text: 'Nueva Opción', Result_pool: 'NONE' });
    renderOptions();
};

function checkBoxes(group, arr) {
    document.querySelectorAll(`#${group} input`).forEach(cb => cb.checked = (arr && arr.includes(cb.value)));
}

function fillEventForm(data) {
    document.getElementById('ev-id').value = data.Id || '';
    document.getElementById('ev-name').value = data.Name || '';
    document.getElementById('ev-desc').value = data.Description || '';
    document.getElementById('ev-prob').value = data.Probability || 50;
    
    checkBoxes('ev-triggers', data.triggers);
    checkBoxes('ev-times', data.times);
    checkBoxes('ev-biomes', data.biomes);

    document.getElementById('ev-mininf').value = data.MinInfamy || 0;
    document.getElementById('ev-maxinf').value = data.MaxInfamy || 100;
    document.getElementById('ev-mingold').value = data.MinGold || 0;
    document.getElementById('ev-minfood').value = data.MinFood || 0;
    document.getElementById('ev-minwater').value = data.MinWater || 0;
    document.getElementById('ev-minarmy').value = data.MinArmySize || 0;
    renderOptions();
}

function gatherCheckboxes(group) {
    let arr = [];
    document.querySelectorAll(`#${group} input:checked`).forEach(cb => arr.push(cb.value));
    return arr;
}

document.getElementById('btn-save').onclick = async () => {
    if (!selectedItem) return;
    
    let isError = false;
    
    if (mode === 'events') {
        selectedItem.data.Id = document.getElementById('ev-id').value;
        selectedItem.data.Name = document.getElementById('ev-name').value;
        selectedItem.data.Description = document.getElementById('ev-desc').value;
        selectedItem.data.Probability = document.getElementById('ev-prob').value;
        selectedItem.data.triggers = gatherCheckboxes('ev-triggers');
        selectedItem.data.times = gatherCheckboxes('ev-times');
        selectedItem.data.biomes = gatherCheckboxes('ev-biomes');
        selectedItem.data.MinInfamy = document.getElementById('ev-mininf').value;
        selectedItem.data.MaxInfamy = document.getElementById('ev-maxinf').value;
        selectedItem.data.MinGold = document.getElementById('ev-mingold').value;
        selectedItem.data.MinFood = document.getElementById('ev-minfood').value;
        selectedItem.data.MinWater = document.getElementById('ev-minwater').value;
        selectedItem.data.MinArmySize = document.getElementById('ev-minarmy').value;
        
        selectedItem.data.options.forEach(opt => {
            if (!opt.Result_pool || opt.Result_pool.trim() === '') opt.Result_pool = 'NONE';
        });
    } else {
        selectedItem.data.Id = document.getElementById('res-id').value;
        selectedItem.data.Name = document.getElementById('res-name').value;
        selectedItem.data.Description = document.getElementById('res-desc').value;
        selectedItem.data.Result_Battle = document.getElementById('res-battle').checked ? "1" : "";
        selectedItem.data.Enemy = document.getElementById('res-battle-enemy').value;
        
        // Validation
        selectedItem.data.effects.forEach(e => {
            if (!e.delta) isError = true;
            if ((e.delta.includes('%') || e.delta.includes('ALL')) && 
                !['initiates','soldiers','sergeants'].includes(e.stat)) {
                alert("Error: % y ALL solo son validos para tropas (Iniciados, Soldados, Sargentos).");
                isError = true;
            }
        });
    }
    
    if (isError) return;
    
    selectedItem.filename = selectedItem.data.Id + (mode === 'events' ? '.evt' : '.res');
    renderList();
    
    const outText = stringifyIni(mode, selectedItem.data);
    
    try {
        let fileHandle;
        if (selectedItem.isNew) {
            let parentDir = (mode === 'events') ? (eventsDirHandle || dirHandle) : (resultsDirHandle || dirHandle);
            fileHandle = await parentDir.getFileHandle(selectedItem.filename, { create: true });
            selectedItem.handle = fileHandle;
            selectedItem.parentHandle = parentDir;
            selectedItem.isNew = false;
        } else {
            fileHandle = selectedItem.handle;
            // renombrar no es facil con esta API sin borrar y crear. Lo guardamos en el handle original por ahora.
        }
        
        const writable = await fileHandle.createWritable();
        await writable.write(outText);
        await writable.close();
        alert("¡Guardado exitosamente!");
    } catch (e) {
        console.error(e);
        alert("Error guardando el archivo.");
    }
};
</script>
